<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>消防管道施工工法 · 60 秒</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--ink:#12161c;--ink-2:#5b6472;--line:#e6e8ec;--accent:#c8102e}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  .bar{
    position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;
    padding:12px 16px;background:rgba(245,246,248,.86);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);font-size:14px;color:var(--ink-2)
  }
  .bar a{color:var(--ink);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .bar .dot{width:3px;height:3px;border-radius:50%;background:#c3c8d0}
  .player{background:#0d1117;position:relative}
  .player video{display:block;width:100%;max-height:70vh;background:#0d1117}
  .info{padding:18px 16px 8px;max-width:680px;margin:0 auto}
  h1{font-size:20px;line-height:1.4;margin:0 0 8px;letter-spacing:-.01em}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tag{font-size:11.5px;color:var(--accent);background:#fdeef0;border-radius:6px;padding:4px 8px;font-weight:500}
  .desc{font-size:14px;line-height:1.7;color:var(--ink-2);margin:0 0 18px}
  .block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .block h2{font-size:13px;margin:0 0 10px;color:var(--ink);letter-spacing:.02em}
  ul{margin:0;padding-left:0;list-style:none}
  li{position:relative;padding-left:16px;font-size:13.5px;line-height:1.8;color:var(--ink-2)}
  li::before{content:"";position:absolute;left:2px;top:11px;width:5px;height:5px;border-radius:50%;background:#d5d9e0}
  .more{max-width:680px;margin:0 auto;padding:0 16px 40px}
  .more h2{font-size:13px;color:var(--ink-2);margin:22px 0 10px;letter-spacing:.04em}
  a.next{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink);font-size:14px}
  a.next span.arrow{color:#b9bfc9;font-size:16px}
  footer{text-align:center;font-size:12px;color:#9aa3af;padding-bottom:28px}
</style>
</head>
<body>

<div class="bar">
  <a href="index.html">← 返回列表</a>
  <span class="dot"></span>
  <span>施工工法视频库</span>
</div>

<div class="player">
  <video id="v" src="videos/fire-pipeline.mp4" controls playsinline preload="auto"></video>
</div>

<div class="info">
  <h1>消防管道施工工法</h1>
  <div class="tags"><span class="tag">消防管道</span><span class="tag">60 秒</span><span class="tag">安装工艺</span></div>
  <p class="desc">用 60 秒梳理消防管道施工的关键动作：管道下料与套丝、支架安装、管道连接与试压，帮助新进场班组快速建立工序概念。</p>
</div>

<div class="more">
  <div class="block">
    <h2>本片可对照以下工序</h2>
    <ul>
      <li>管材进场检查与下料</li>
      <li>支吊架安装与标高控制</li>
      <li>管道连接（螺纹 / 沟槽）</li>
      <li>水压试验与冲洗</li>
    </ul>
  </div>

  <h2>下一个视频</h2>
  <a class="next" href="road.html">
    <span>道路工程施工工法（中英双语）</span>
    <span class="arrow">›</span>
  </a>

  <footer>视频仅供学习交流使用</footer>
</div>

<script>
  var v = document.getElementById('v');
  v.muted = true;
  var p = v.play();
  if (p && p.catch) p.catch(function(){ v.muted = false; });
  v.addEventListener('playing', function(){ if (v.muted) { v.muted = false; } }, {once:true});
</script>
</body>
</html>
